<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paopao</title>
<style>
  :root{--bg:#FFF5F8;--card:#FFF;--ink:#2D2A32;--mute:#8E8A99;--pos:#38C79C;--neg:#FF7FAF;--bad:#E5484D;--warn:#E5A400;--line:#F0E6EC;--pri:#8B78EE;--chip:#F8F5FF;--inp:#FDFAFC}
  body.dark{--bg:#12121a;--card:#1e1e2a;--ink:#e8e8f0;--mute:#8888a0;--line:#2a2a3a;--chip:#232332;--inp:#22222e;--pri:#a890f8}
  body[data-theme="blue"]{--bg:#EFF6FF;--card:#FFF;--line:#D6E6F5;--pri:#4FAEF2;--chip:#E6F2FF;--inp:#F5FAFF}
  body[data-theme="green"]{--bg:#EFFBF4;--card:#FFF;--line:#CDEBDC;--pri:#38C79C;--chip:#DEF6EA;--inp:#F5FFF9}
  body[data-theme="orange"]{--bg:#FFF6F0;--card:#FFF;--line:#F5DCCF;--pri:#FF9168;--chip:#FFEAD9;--inp:#FFF8F3}
  body[data-theme="red"]{--bg:#FFF0F5;--card:#FFF;--line:#F5D0DD;--pri:#FF7FAF;--chip:#FFE0EB;--inp:#FFF5F8}
  body[data-theme="gold"]{--bg:#FFFCEF;--card:#FFF;--line:#F0E4C0;--pri:#EFB02E;--chip:#FFF4D6;--inp:#FFFCF5}
  body.dark[data-theme="blue"]{--bg:#0c1420;--card:#1a2233;--line:#1d2a3a;--pri:#6ec0f5;--chip:#1e2936;--inp:#1a2430}
  body.dark[data-theme="green"]{--bg:#0c1a14;--card:#1a2a22;--line:#1d3a2a;--pri:#5dd4aa;--chip:#1c302a;--inp:#182820}
  body.dark[data-theme="orange"]{--bg:#1a1410;--card:#281e18;--line:#3a2a1d;--pri:#ff9d7a;--chip:#2e221c;--inp:#2a1e18}
  body.dark[data-theme="red"]{--bg:#1a1016;--card:#281a22;--line:#3a1e2c;--pri:#ff95ba;--chip:#2e1c26;--inp:#281a22}
  body.dark[data-theme="gold"]{--bg:#1a1510;--card:#281e18;--line:#3a2e1c;--pri:#f0c050;--chip:#2e2418;--inp:#281e16}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:12px 12px 90px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;transition:background .3s,color .3s}
  h1{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid var(--line);position:relative}
  .card.compact{padding:0}
  .card.compact .cbtn{width:100%;background:none;border:0;padding:14px 16px;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .cbtn .cn{flex:1;font-weight:600}
  .cbtn .cv{font-weight:700;font-variant-numeric:tabular-nums}
  .cbtn .cc{color:var(--mute);font-size:18px}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .top .name{font-weight:700;font-size:16px;flex:1}
  .top .tag{font-size:11px;background:var(--chip);color:var(--pri);padding:2px 8px;border-radius:20px}
  .top .lnk{background:none;border:0;color:var(--mute);font-size:13px;padding:4px;cursor:pointer}
  .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 6px}
  .big.neg{color:var(--neg)}.big.pos{color:var(--pos)}
  .sub{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);margin:3px 0;gap:8px}
  .sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .sub b.neg{color:var(--neg)}.sub b.pos{color:var(--pos)}.sub b.over{color:var(--bad)}.sub b.warn{color:var(--warn)}
  .chip{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px}
  .chip b{font-size:18px;font-variant-numeric:tabular-nums}
  .chip b.neg{color:var(--neg)}.chip b.pos{color:var(--pos)}.chip b.warn{color:var(--warn)}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s}
  .bar.green i{background:var(--pos)}
  .bar.red i{background:var(--bad)}
  .bar.gold i{background:var(--warn)}
  input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);color:var(--ink);width:100%;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--pri)}
  input.err,select.err,textarea.err{border-color:var(--bad);background:#FFF5F5}
  .b{font:inherit;font-weight:600;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;transition:all .15s}
  .b:active{transform:scale(.97)}
  .b.p{background:var(--pri);color:#fff;border-color:var(--pri)}
  .b.m{background:#FFF0F5;color:var(--neg);border-color:#FFE0EB}
  .b.v{background:var(--chip);color:var(--pri);border-color:var(--line)}
  .b.g{background:#E8FBF3;color:var(--pos);border-color:#C8F0E2}
  body.dark .b.m{background:#3a1f2a;border-color:#4a2a3a}
  body.dark .b.g{background:#1a3a2f;border-color:#255040}
  .b:disabled{opacity:.4;pointer-events:none}
  .set{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .set label{font-size:12px;color:var(--mute);margin-bottom:-4px}
  .set .row2{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
  .lnk{background:none;border:0;color:var(--pri);font-size:13px;padding:6px 0;cursor:pointer;text-align:left}
  details{margin-top:10px}
  summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;color:var(--pri);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ "}
  details[open] summary::before{content:"▾ "}
  ul{list-style:none;padding:0;margin:8px 0}
  ul li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  ul li:last-child{border-bottom:0}
  ul li .n{flex:1;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul li b{font-variant-numeric:tabular-nums;font-weight:600}
  ul li b.neg{color:var(--neg)}ul li b.pos{color:var(--pos)}
  ul li button{background:none;border:0;color:var(--mute);font-size:15px;padding:4px 6px;cursor:pointer}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .chk input{width:auto}
  .grid{display:flex;flex-direction:column;gap:8px}
  .empty{text-align:center;color:var(--mute);padding:20px;font-size:14px}
  .alert{background:#FFF8E6;border:1px solid #FFE8B3;color:#8A6D00;padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  body.dark .alert{background:#2a2410;border-color:#4a3a10;color:#f0d060}
  .alert span{flex:1}
  .alert .x{background:none;border:0;color:inherit;font-size:20px;padding:0 6px;cursor:pointer;line-height:1}
  .imp{background:#FFF5F5;border:1px solid #FFD5D5;padding:10px;border-radius:12px;font-size:13px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .st{background:var(--inp);border-radius:12px;padding:10px;border:1px solid var(--line)}
  .st small{display:block;color:var(--mute);font-size:11px}
  .st b{display:block;font-size:17px;margin:2px 0;font-variant-numeric:tabular-nums}
  .st b.neg{color:var(--neg)}.st b.pos{color:var(--pos)}
  .st i{font-style:normal;font-size:11px;color:var(--mute)}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
  .tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .icons button{aspect-ratio:1;font-size:20px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;padding:0}
  .icons button.on{border-color:var(--pri);background:var(--chip)}
  .mt{display:grid;grid-template-columns:60px 1fr 1fr 1fr;gap:4px;font-size:12px;margin-top:8px}
  .mt span,.mt b{padding:4px}
  .mt .neg{color:var(--neg)}
  .recent{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
  .recent h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
  .recent .tabs{margin-bottom:10px}
  .recent .list{max-height:320px;overflow-y:auto}
  .recent .list .grp{font-size:11px;color:var(--mute);margin:10px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .recent .list .item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .recent .list .item:last-child{border-bottom:0}
  .recent .list .item .n{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recent .list .item .amt{font-weight:700;font-variant-numeric:tabular-nums}
  .recent .list .item .amt.neg{color:var(--neg)}.recent .list .item .amt.pos{color:var(--pos)}
  .recent .list .item .undo{background:#FFF0F5;border:1px solid #FFE0EB;color:var(--neg);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
  dialog{border:0;border-radius:16px;padding:20px;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin:0 0 10px;font-size:16px}
  dialog p{margin:6px 0;font-size:14px;color:var(--mute)}
  dialog .btns{display:flex;gap:8px;margin-top:16px}
  dialog .btns button{flex:1}
  #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(45,42,50,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:1000;display:none;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  #undo{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(45,42,50,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:1000;display:none;max-width:90%;align-items:center;gap:12px}
  #undo button{background:var(--pri);border:0;color:#fff;padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  #lock{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  .lt{font-size:18px;font-weight:700}
  .ld{font-size:28px;letter-spacing:8px}
  .lm{color:var(--bad);font-size:14px;min-height:20px}
  .lp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;width:100%}
  .lp button{aspect-ratio:1;font-size:20px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-weight:600}
  #jtop{margin-bottom:0}
  #sslot{display:flex;flex-direction:column;gap:12px}
  #sslot>.sub{text-align:center;font-size:12px;color:var(--mute);margin:4px 0}
  .t-d .big{color:var(--ink)}.t-f .big{color:#4FAEF2}.t-k .big{color:var(--neg)}.t-c .big{color:#38C79C}.t-i .big{color:#EFB02E}.t-g .big{color:var(--pri)}.t-o .big{color:#7ACB5B}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;padding:10px 4px 12px;font:inherit;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
  nav button.on{color:var(--pri);font-weight:700}
  nav button span{font-size:20px}
  .fab{display:none}
  #nic{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
  #nic button{aspect-ratio:1;font-size:20px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;padding:0}
  #nic button.on{border-color:var(--pri);background:var(--chip)}
  .pcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--inp);display:flex;flex-direction:column;gap:8px}
  .prow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
  .emg{border:2px solid var(--warn);border-radius:12px;padding:12px;margin:10px 0;background:#FFFBEB}
  body.dark .emg{background:#2a2410}
  .emg h4{margin:0 0 8px;font-size:14px;color:var(--warn)}
  .debt{border:1px solid var(--bad);border-radius:12px;padding:10px;margin:8px 0;background:#FFF5F5}
  body.dark .debt{background:#2a1a1a}
  .debt h4{margin:0 0 6px;font-size:14px;color:var(--bad)}
  .top-over{background:var(--chip);border-radius:12px;padding:10px;margin:10px 0;border:1px solid var(--line)}
  .top-over h4{margin:0 0 6px;font-size:13px;color:var(--mute)}
  .top-over .item{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
  .top-over .item b{color:var(--bad)}
  .bar-chart{display:flex;gap:4px;align-items:flex-end;height:120px;margin:12px 0;padding:0 4px}
  .bar-chart .bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
  .bar-chart .bc .bcr{width:100%;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
  .bar-chart .bc .bcl{font-size:9px;color:var(--mute);text-align:center}
  .inout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;padding:10px;background:var(--chip);border-radius:12px}
  .inout .row{display:flex;flex-direction:column;gap:6px}
  .inout .row .lbl{font-size:12px;color:var(--mute);font-weight:600}
  .inout .row button{padding:8px 10px;font-size:13px;border-radius:10px}
</style>
</head>
<body>
<h1>🐷 กระปุกของฉัน</h1>
<div id="alerts"></div>

<section id="tab1">
  <div id="jtop"></div>
  <div id="jars"></div>
  <div id="recent"></div>
  <div id="sslot"></div>
</section>

<section id="tab2" hidden>
  <div id="sal"></div>
</section>

<section id="tab3" hidden>
  <div id="sum"></div>
</section>

<section id="tab4" hidden>
  <div id="cfg"></div>
</section>

<nav>
  <button id="nav1" class="on"><span>🏠</span>กระปุก</button>
  <button id="nav2"><span>⚙️</span>เป๋าหลัก</button>
  <button id="nav3"><span>📊</span>สรุป</button>
  <button id="nav4"><span>🛠️</span>ตั้งค่า</button>
</nav>

<script>const KEY="jars-v2";
const EM={d:"🐷",f:"🏦",k:"📈",c:"🧸",o:"🍀",i:"🛡️",g:"💰",emg:"⚠️",debt:"💳"};
const TY={d:"รายรับ-รายจ่าย",f:"PVD + สหกรณ์",k:"DCA หุ้น",c:"กองทุนลูก",o:"เงินเหลือ",i:"ประกัน",g:"กระปุกทั่วไป",emg:"งบฉุกเฉิน",debt:"หนี้"};
const RATES={pvd:5,pvdEmp:9,coop:5,dca:7,child:3};
const CATS_IN=["เงินเดือน","โบนัส","ขายของ","ดอกเบี้ย","อื่นๆ"];
const CATS_OUT=["ค่าอาหาร","ค่าน้ำ","ค่าช้อปปิ้ง","ค่าเดินทาง","ค่ารายเดือนให้ที่บ้าน","ค่ารายเดือนทั่วไป","ค่าโทรศัพท์","อื่นๆ"];

let S={salary:0,auto:false,last:"",jars:[],theme:"light",color:"purple"};
let OPEN=0,CBO=0,MB=0;
let LOADERR=false,LASTSAVED="",RAWLOAD="";

try{
  const r=window.Android?Android.load():localStorage.getItem(KEY);
  if(r){
    LASTSAVED=r;RAWLOAD=r;
    try{S=Object.assign(S,JSON.parse(r))}
    catch(e){
      LOADERR=true;
      try{localStorage.setItem(KEY+"-bak",r)}catch(_){}
    }
  }
}catch(e){LOADERR=true}

function migrate(){
  if(!Array.isArray(S.jars))return;
  const ps=S.jars.filter(j=>j&&j.type==="p");
  const ss=S.jars.filter(j=>j&&j.type==="s");
  if(!ps.length&&!ss.length)return;
  try{localStorage.setItem(KEY+"-bak",RAWLOAD||JSON.stringify(S))}catch(e){}
  try{
    const txs=j=>Array.isArray(j.tx)?j.tx:[];
    const tag=(j,k)=>txs(j).map(t=>Object.assign({},t,{k}));
    let f=S.jars.find(j=>j&&j.type==="f");
    const had=!!f,base=ps[0]||ss[0];
    if(!f)f={id:base.id,type:"f",name:"PVD + สหกรณ์",emp:0,er:0,prate:RATES.pvd,mon:0,srate:RATES.coop,yrs:10,tx:[]};
    if(!Array.isArray(f.tx))f.tx=[];
    for(const j of ps){
      if(!f.emp)f.emp=j.emp||0;
      if(!f.er)f.er=j.er||0;
      if(!f.prate)f.prate=j.rate||RATES.pvd;
      f.yrs=j.yrs||f.yrs;
      f.tx.push(...tag(j,"p"));
    }
    for(const j of ss){
      if(!f.mon)f.mon=j.mon||0;
      if(!f.srate)f.srate=j.rate||RATES.coop;
      f.tx.push(...tag(j,"s"));
    }
    const at=S.jars.indexOf(base);
    S.jars=S.jars.filter(j=>j&&j.type!=="p"&&j.type!=="s");
    if(!had)S.jars.splice(Math.max(0,Math.min(at,S.jars.length)),0,f);
  }catch(e){LOADERR=true}
}

function defNotif(){
  if(!S.notif)S.notif={};
  if(!S.notif.daily)S.notif.daily={on:false,pct:100};
  if(!S.notif.cats)S.notif.cats={on:false,pct:90,over:false,list:[]};
  if(!S.notif.emg)S.notif.emg={on:true};
  if(!S.dismissed)S.dismissed={};
}

function clean(){
  const f=x=>Number.isFinite(+x)?+x:0;
  S.salary=f(S.salary);
  S.extra=f(S.extra);
  S.deduct=f(S.deduct);
  if(!S.theme)S.theme="light";
  if(!S.color)S.color="purple";
  if(!Array.isArray(S.jars)){
    try{localStorage.setItem(KEY+"-bak",RAWLOAD||"")}catch(e){}
    LOADERR=true;
    S.jars=[];
  }
  S.jars=S.jars.filter(j=>j&&typeof j==="object"&&j.id!=null&&j.type);
  for(const j of S.jars){
    j.name=String(j.name||"กระปุก");
    if(j.type==="f"){
      if(!(j.prate>0))j.prate=RATES.pvd;
      if(!(j.srate>0))j.srate=RATES.coop;
      if(!(j.pvdEmp>0))j.pvdEmp=RATES.pvdEmp;
    }else if(j.type==="k"){
      if(!(j.rate>0))j.rate=RATES.dca;
    }else if(j.type==="c"||j.type==="g"){
      if(!(j.rate>0))j.rate=RATES.child;
    }
    if(j.type==="i"&&j.pct>0&&!(j.mon>0)){
      j.mon=Math.round(S.salary*j.pct/100);
      delete j.pct;
    }
    if(j.type==="emg"&&typeof j.min!=="number")j.min=0;
    if(j.type==="debt"&&typeof j.orig!=="number")j.orig=0;
    j.tx=(Array.isArray(j.tx)?j.tx:[]).filter(t=>t&&Number.isFinite(+t.a)&&typeof t.d==="string"&&/^\d{4}-\d{2}-\d{2}/.test(t.d)).map(t=>{t.a=+t.a;return t});
  }
}

clean();migrate();defNotif();

const $=id=>document.getElementById(id);
let _st=null;

const flush=()=>{
  if(_st){clearTimeout(_st);_st=null}
  try{
    const j=JSON.stringify(S);
    LASTSAVED=j;
    if(window.Android)Android.save(j);
    else localStorage.setItem(KEY,j);
  }catch(e){
    toast(e&&e.name==="QuotaExceededError"?"พื้นที่จัดเก็บเต็ม":"บันทึกไม่สำเร็จ");
  }

const stats=ym=>{if(SCV!==V){SC={};SCV=V}return SC[ym]||(SC[ym]=stats0(ym))};

function stats0(ym){
  const sum=o=>Object.values(o).reduce((x,y)=>x+y,0);
  if(ym.length===4){
    const X=idx();
    const ks=[...new Set([...Object.keys(S.mon||{}),...Object.keys(X)])].filter(k=>k.startsWith(ym));
    const o={inc:0,reg:0,add2:0,ex:{},sv:{},buy:0,prem:0,over:{}};
    for(const k of ks){
      const m=stats(k);
      o.inc+=m.inc;o.reg+=m.reg;o.add2+=m.add2;o.buy+=m.buy;o.prem+=m.prem;
      for(const n in m.ex)o.ex[n]=(o.ex[n]||0)+m.ex[n];
      for(const n in m.sv)o.sv[n]=(o.sv[n]||0)+m.sv[n];
      for(const n in m.over)o.over[n]=(o.over[n]||0)+m.over[n];
    }
    o.spend=sum(o.ex);o.save=sum(o.sv);o.left=o.inc-o.spend-o.save;
    return o;
  }
  const mon=(S.mon||{})[ym]||{};
  const ex={};
  const snap=mon.sav?Object.assign({},mon.sav):null;
  const sv=snap||{};
  let add2=0,buy=0,prem=0;
  for(const [j,t] of (idx()[ym]||[])){
    const tp=j.type;
    if(tp==="d"||tp==="o"||tp==="emg"){
      if(isSys(t)||t.m)continue;
      if(t.a<0){
        const k=t.c||(tp==="o"?"จากเงินเหลือ":"ไม่ระบุหมวด");
        ex[k]=(ex[k]||0)-t.a;
      }else add2+=t.a;
    }else if(tp==="i"&&t.a<0)prem+=-t.a;
    else if(t.a>0&&"fkcipsg".includes(tp)){
      if(!AUTON.includes(t.n))buy+=t.a;
      else if(!snap){
        let a=t.a;
        if(tp==="f"&&t.n==="สมทบ PVD"&&(j.emp||0)+(j.er||0)>0)a=a*(j.emp||0)/((j.emp||0)+(j.er||0));
        sv[j.name]=(sv[j.name]||0)+a;
      }
    }
  }
  if(mon.ded>0)ex["หักอื่นๆ (ภาษี ฯลฯ)"]=mon.ded;
  const inc=(mon.inc||0)+add2;
  const over={};
  const dj=S.jars.find(j=>j.type==="d");
  if(dj&&dj.cb){
    for(const k in dj.cb){
      const b=dj.cb[k];
      if(!(b>0))continue;
      const sp=ex[k]||0;
      if(sp>b)over[k]=sp-b;
    }
  }
  return {inc,reg:mon.inc||0,add2,ex,sv,buy,prem,over,spend:sum(ex),save:sum(sv),left:inc-sum(ex)-sum(sv)};
}

function postRec(j){
  const cur=curC();
  for(const r of j.rec||[]){
    if(!r.last)r.last=cur;
    let g=0;
    while(r.last<cur&&g++<120){
      r.last=shiftM(r.last,1);
      const d=cs(r.last);
      const t={id:Date.now()+Math.random(),a:-Math.abs(r.a),d:d>td()?td():d,n:"ประจำ: "+r.n};
      if(r.c)t.c=r.c;
      j.tx.push(t);
    }
  }
}

function postAcc(j){
  if(!j.accOn)return;
  const cur=curC();
  if(!j.accLast){j.accLast=cur;return}
  let g=0;
  while(j.accLast<cur&&g++<120){
    j.accLast=shiftM(j.accLast,1);
    const d=cs(j.accLast),dt=d>td()?td():d;
    const ks=j.type==="f"?[["p",j.prate],["s",j.srate]]:[["",j.rate]];
    for(const [k,r] of ks){
      if(!(r>0)||(j.type==="k"&&j.price>0&&units(j)>0))continue;
      const a=Math.round((k?bk(j,k):agg(j).sum)*r/1200*100)/100;
      if(a>0){const t={id:Date.now()+Math.random(),a,d:dt,n:"ผลตอบแทน",adj:1};if(k)t.k=k;j.tx.push(t)}
    }
  }
}

function postDebt(j){
  const cur=curC();
  if(!j.debtLast){j.debtLast=cur;return}
  let g=0;
  while(j.debtLast<cur&&g++<240){
    j.debtLast=shiftM(j.debtLast,1);
    const d=cs(j.debtLast);
    const rate=(j.rate||0)/1200;
    const interest=Math.round(agg(j).sum*rate*100)/100;
    if(interest>0)j.tx.push({id:Date.now()+Math.random(),a:-interest,d:d,n:"ดอกเบี้ย",adj:1});
    if(j.mon>0)j.tx.push({id:Date.now()+Math.random()+1,a:j.mon,d:d,n:"ผ่อนชำระ"});
  }
}

function alertsList(){
  const L=[],t0=td(),N=S.notif||{};
  const dj=S.jars.find(j=>j.type==="d");
  if(dj && N.daily && N.daily.on===true){
    const net=cm(dj).filter(t=>t.d===t0&&!isSys(t)).reduce((s,t)=>s+t.a,0);
    const spent=-cm(dj).filter(t=>t.d===t0&&t.a<0&&!isSys(t)).reduce((s,t)=>s+t.a,0);
    const dl=Math.max(1,dd(t0,dj.end||eom())+1);
    const b=bal(dj);
    const lim=b/dl+net;
    if(lim>0){
      const pct=spent/lim*100;
      const th=N.daily.pct||100;
      if(pct>=th)L.push({id:"daily:"+t0,text:"💸 วันนี้ใช้ไป "+Math.round(pct)+"% ของงบวัน ("+fmt(spent)+" / "+fmt(lim)+" ฿)"});
    }
  }
  if(N.cats && N.cats.on===true){
    const sel=N.cats.list||[];
    const th=N.cats.pct||90;
    for(const j of S.jars){
      if(j.type!=="d"||!j.cb)continue;
      for(const k of Object.keys(j.cb)){
        const b=j.cb[k];
        if(!(b>0))continue;
        if(!sel.includes(k))continue;
        const sp=-cm(j).filter(t=>t.a<0&&t.c===k).reduce((x,t)=>x+t.a,0);
        const pct=sp/b*100;
        if(N.cats.over===true && sp>b){
          L.push({id:"cat-over:"+k,text:"⚠️ "+k+" เกินงบ "+fmt(sp-b)+" ฿ (ใช้ "+fmt(sp)+" / "+fmt(b)+" ฿)"});
        }else if(pct>=th){
          L.push({id:"cat-near:"+k,text:"⚡ "+k+" ใช้ไป "+Math.round(pct)+"% ของงบ ("+fmt(sp)+" / "+fmt(b)+" ฿)"});
        }
      }
    }
  }
  if(N.emg && N.emg.on!==false){
    for(const j of S.jars){
      if(j.type!=="emg")continue;
      const min=j.min||0;
      if(min>0&&bal(j)<min)L.push({id:"emg:"+j.id,text:"⚠️ งบฉุกเฉินต่ำกว่าเป้า "+(min-bal(j))+" ฿"});
    }
  }
  const dis=S.dismissed||{};
  return L.filter(x=>dis[x.id]!==t0);
}

const h53=(str,seed=0)=>{
  let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){
    ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return String(4294967296*(2097151&h2)+(h1>>>0));
};
const pinH=p=>h53("jars|"+p);

function lockUI(){
  if(!S.pin||LOCKED)return;
  LOCKED=true;
  const o=document.createElement("div");o.id="lock";
  const dots=el("div","ld"),msg=el("div","lm");
  let v="";
  const draw=()=>{dots.textContent="●".repeat(v.length)+"○".repeat(Math.max(0,6-v.length))};

  for(const k of ["1","2","3","4","5","6","7","8","9","⌫","0","✔"]){

      else if(k==="✔"){if(pinH(v)===S.pin)return unlock();msg.textContent="PIN ไม่ถูกต้อง";v=""}
      else if(v.length<6)v+=k;
      draw();
      if(k!=="✔"&&k!=="⌫"&&pinH(v)===S.pin)unlock();
    };
    pad.append(b);
  }
  o.append(el("div","lt","🔒 ใส่ PIN เพื่อเปิดแอป"),dots,msg,pad);
  if(window.Android&&Android.bio){

  }
  const fg=el("button","lnk","ลืม PIN (ล้างข้อมูลทั้งหมด)");fg.type="button";

  o.append(fg);
  document.body.append(o);
}

function renameCatOut(a,b){
  S.cats=catsOut().map(x=>x===a?b:x);
  for(const j of S.jars){
    for(const t of j.tx)if(t.c===a)t.c=b;
    if(j.cb&&a in j.cb){j.cb[b]=j.cb[a];delete j.cb[a]}
    for(const r of j.rec||[])if(r.c===a)r.c=b;
  }
  CFO=true;
  S.jars.forEach(touch);
  done();
}

function renameCatIn(a,b){
  S.catsIn=catsIn().map(x=>x===a?b:x);
  for(const j of S.jars){
    for(const t of j.tx)if(t.c===a)t.c=b;
    for(const r of j.rec||[])if(r.c===a)r.c=b;
  }
  CFO=true;
  S.jars.forEach(touch);
  done();
}

function budgetLines(){
  const L=[["เงินเดือน",S.salary]];
  if(S.extra)L.push(["รายได้อื่นประจำ",S.extra]);
  if(S.deduct)L.push(["หักอื่นๆ (ภาษี ฯลฯ)",-S.deduct]);
  for(const x of S.jars){
    if(x.rest||x.type==="emg"||x.type==="debt")continue;
    if(x.type==="f"){
      const p=S.salary*(x.emp||0)/100;
      if(p>0)L.push(["หัก PVD ส่วนเรา",-p]);
      if(x.mon>0)L.push(["หักส่งหุ้นสหกรณ์",-x.mon]);
    }else{
      const a=empPart(x);
      if(a>0)L.push(["หัก "+x.name,-a]);
    }
  }
  for(const x of S.jars){
    if(x.type==="debt"&&x.mon>0)L.push(["หักผ่อน "+x.name,-x.mon]);
  }
  return L;
}

const firstG=v=>{
  v=v.trim();
  if(!v)return "";
  return window.Intl&&Intl.Segmenter
    ?[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(v)][0].segment
    :Array.from(v)[0];
};

function iconPick(p,cur,cb){
  const g=el("div","icons");
  for(const x of ICONS){
    const b=el("button",x===cur?"on":"",x);b.type="button";
    b.onclick=()=>cb(x);
    g.append(b);
  }
  const i=el("input");i.placeholder="หรือพิมพ์อีโมจิเอง";i.style.marginTop="8px";
  i.onchange=()=>{const x=firstG(i.value);if(x)cb(x)};

function fld(p,label,o,k,kind,opts){
  p.append(el("label",null,label));
  let i;
  if(opts){
    i=el("select");
    for(const [v,t] of opts){const op=el("option",null,t);op.value=v;i.append(op)}
    i.value=o[k]||opts[0][0];
  }else{
    i=el("input");
    i.type=kind==="date"?"date":"text";
    if(kind==="n")i.inputMode="decimal";
    i.value=o[k]||"";
  }
  i.onchange=()=>{
    if(kind==="n"){
      const r=parseNum(i.value);
      if(r.bad){i.classList.add("err");toast(NUMMSG);return}
      if(PCT.includes(k)&&r.v>100){i.classList.add("err");toast("ช่องนี้เป็น %");return}
      o[k]=r.empty?0:r.v;
    }else{
      o[k]=kind==="t"?i.value.trim().toUpperCase():kind==="x"?(i.value.trim()||o[k]):(kind==="date"||opts)?i.value:0;
    }
    if(k==="sym")o.price=0;
    if(k==="end"){o.endCustom=!!i.value;if(!i.value)o.end=cend()}
    done();
    if(k==="sym")refresh();
  };
  p.append(i);
}

function run(){
  if(!(S.salary>0))return -1;
  const ym=curC(),n0=S.jars.reduce((x,j)=>x+j.tx.length,0);
  for(const j of S.jars){
    if(j.type==="emg"||j.type==="debt"){
      if(j.mon>0)add(j,j.mon,"เงินเดือนออก");
      continue;
    }
    if(j.rest){j.end=eom();continue}
    if(cm(j).some(t=>AUTON.includes(t.n)&&t.n!=="ผลตอบแทน"))continue;
    if(j.type==="f"){
      const pv=S.salary*((j.emp||0)+(j.er||0))/100;
      if(pv>0)add(j,pv,"สมทบ PVD",false,"","p");
      if(j.mon>0)add(j,j.mon,"ส่งหุ้นสหกรณ์",false,"","s");
      continue;
    }
    const a=monthly(j);
    if(a>0)add(j,a,"แบ่งเงินเดือน");
  }
  S.last=curC();
  return S.jars.reduce((x,j)=>x+j.tx.length,0)-n0;
}

}

        const r1=el("div","row");
        r1.append(el("span","lbl","💵 รายรับ"));
        r1.append(btn("g","+ เพิ่มรายรับ",()=>{
          askAmt("รับเข้า",false,(amt,cat)=>{
            OPEN=j.id;
            add(j,amt,"",false,cat);
            done();
          });
        }));
        const r2=el("div","row");
        r2.append(el("span","lbl","💸 รายจ่าย"));
        r2.append(btn("m","− เพิ่มรายจ่าย",()=>{
          askAmt("ใช้จ่าย",true,(amt,cat)=>{
            OPEN=j.id;
            add(j,-amt,"",false,cat);
            done();
          });
        }));
        io.append(r1,r2);
        c.append(io);

        j.cb=j.cb||{};
        const cd=el("details");cd.open=CBO===j.id;
        cd.append(el("summary",null,"งบแยกตามหมวดต่อเดือน"));
        const cg=el("div","set");
        cg.addEventListener("focusin",()=>{OPEN=j.id;CBO=j.id});
        for(const k of catsOut())fld(cg,k,j.cb,k,"n");
        const ab=el("button","lnk","✨ แบ่งงบอัตโนมัติ");ab.type="button";
        ab.onclick=()=>{
          OPEN=j.id;CBO=j.id;
          const ms=-cm(j).filter(t=>t.a<0&&!isSys(t)).reduce((x,t)=>x+t.a,0);
          const base=j.rest?monthly(j):Math.max(0,bal(j)+ms);
          const fixed=MO.reduce((x,k)=>x+(j.cb[k]||0),0);
          const rest=Math.max(0,base-fixed);
          const w={"ค่าอาหาร":45,"ค่าน้ำ":5,"ค่าช้อปปิ้ง":15,"ค่าเดินทาง":20,"อื่นๆ":15};
          for(const k in w)j.cb[k]=Math.round(rest*w[k]/100);
          done();
        };
        cg.append(ab);cd.append(cg);set.append(cd);
      }

      if(j.type==="i"){
        const dl=j.due?dd(td(),j.due):null;
        line("กันไว้เดือนละ",fmt(monthly(j))+" ฿");
        if(j.premium>0)line("เบี้ยต่องวด ("+(j.cyc==="y"?"รายปี":"รายเดือน")+")",fmt(j.premium)+" ฿");
        line("ครบกำหนด",dl==null?"ยังไม่ตั้งวัน":dl<0?"เลยกำหนด "+(-dl)+" วัน":"อีก "+dl+" วัน");
        if(j.cover)line("ทุนประกัน",fmt(j.cover)+" ฿");
        inp.placeholder="จำนวนเงิน";
        q.append(inp,btn("m","− ใช้",go(-1)),btn("p","+ เติม",go(1)));
        c.append(q);
        const pay=btn("v","จ่ายเบี้ยงวดนี้",()=>{
          add(j,-(j.premium||0),"จ่ายเบี้ย");
          if(j.due){
            const d=new Date(j.due);
            j.cyc==="y"?d.setFullYear(d.getFullYear()+1):d.setMonth(d.getMonth()+1);
            j.due=ymd(d);
          }
          done();
        });
        pay.style.marginTop="8px";pay.style.width="100%";
        c.append(pay);
        fld(set,"กันต่อเดือน (บาท)",j,"mon","n");
        fld(set,"เบี้ยต่องวด (บาท)",j,"premium","n");
        fld(set,"รอบจ่าย",j,"cyc","s",[["m","รายเดือน"],["y","รายปี"]]);
        fld(set,"ครบกำหนดจ่ายวันที่",j,"due","date");
        fld(set,"ทุนประกัน",j,"cover","n");
      }

      if(j.type==="k"){
        const u=units(j),cost=agg(j).cost,pl=b-cost;
        line("ลงทุนสะสม (ต้นทุน)",fmt(cost)+" ฿");
        const g2=el("div","sub");
        g2.append(
          el("span",null,"กำไร/ขาดทุน"),
          el("b",pl<0?"neg":"pos",(pl<0?"−":"+")+fmt(Math.abs(pl))+" ฿"+(cost>0?" ("+(pl/cost*100).toFixed(1)+"%)":""))
        );
        c.append(g2);
        if(u>0)line("ถือ "+px(u)+" หน่วย",px(cost/u)+" ฿");
        const when=j.pt?" · "+new Date(j.pt).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}):"";
        line(j.sym?"ราคา "+j.sym:"ราคาต่อหน่วย",
          j.price>0?px(j.price)+" ฿"+when
          :j.perr?"ดึงราคาไม่ได้"
          :j.sym&&!hasA()?"ดึงได้เฉพาะในแอป"
          :"ยังไม่มีราคา");
        line("DCA เดือนละ",fmt(monthly(j))+" ฿");
        line("ประมาณการอีก "+YR()+" ปี",fmt(proj(b,monthly(j),j.rate,YR()))+" ฿");

        const mb=el("details");mb.open=MB===j.id;mb.style.marginTop="12px";
        mb.append(el("summary",null,"✍️ บันทึกซื้อ/ขาย/ราคาเอง"));
        const mg=el("div","set");
        mg.addEventListener("focusin",()=>{OPEN=j.id;MB=j.id});
        const sel=el("select");
        for(const [v,t] of [["b","ซื้อ"],["s","ขาย"]]){
          const o=el("option",null,t);o.value=v;sel.append(o);
        }
        mg.append(el("label",null,"ประเภทรายการ"),sel);
        const mk=(l,ph)=>{
          mg.append(el("label",null,l));
          const i=el("input");i.type="text";i.inputMode="decimal";
          if(ph)i.placeholder=ph;
          mg.append(i);return i;
        };
        const fd=el("input");fd.type="date";fd.value=td();
        mg.append(el("label",null,"วันที่"),fd);
        const fa=mk("จำนวนเงิน","เช่น 5000"),fp=mk("ราคาต่อหน่วย","เช่น 34"),fu=mk("จำนวนหน่วย","ใส่ 2 ใน 3 ช่อง");
        const msg=el("div","sub");
        const ok=btn("p","บันทึก",()=>{
          let a=pn(fa),pr=pn(fp),un=pn(fu);
          if([fa,fp,fu].some(e=>e._why==="bad"))return;
          const h=x=>x>0;
          if(h(a)&&h(pr)&&!h(un))un=a/pr;
          else if(h(a)&&h(un)&&!h(pr))pr=a/un;
          else if(h(pr)&&h(un)&&!h(a))a=pr*un;
          const d=fd.value||td();
          if(sel.value==="b"){
            if(!h(a)){msg.textContent=FILLMSG;toast(FILLMSG);return}
            j.tx.push({id:Date.now()+Math.random(),a,d,n:"ซื้อเอง"+(h(pr)?" @"+px(pr):""),u:h(un)?un:0,c:"",k:""});
          }else{
            if(!h(un)&&h(a)&&j.price>0)un=a/j.price;
            if(!h(un)||un>u+1e-9){msg.textContent="ใส่จำนวนหน่วยที่ขาย";toast(msg.textContent);return}
            j.tx.push({id:Date.now()+Math.random(),a:-(u>0?cost/u*un:0),d,n:"ขาย "+px(un)+" หน่วย",u:-un,c:"",k:""});
          }
          MB=j.id;OPEN=j.id;done();
        });
        mg.append(ok,msg);
        mg.append(el("label",null,"อัปเดตราคาปัจจุบันต่อหน่วย"));
        const np=el("input");np.type="text";np.inputMode="decimal";np.placeholder=j.price>0?px(j.price):"";
        mg.append(np);
        mg.append(btn("v","อัปเดตราคา",()=>{
          const x=pn(np);
          if(!(x>0)){need(np);return}
          j.price=x;j.pt=Date.now();j.mp=true;MB=j.id;OPEN=j.id;done();
        }));
        mb.append(mg);
        extra=mb;

        inp.placeholder="จำนวนเงินที่ซื้อ (บาท)";
        q.append(inp,btn("p","+ ซื้อ",()=>{
          const a=pn(inp);
          if(!(a>0)){need(inp);return}
          if(j.price>0)j.tx.push({id:Date.now()+Math.random(),a,d:td(),n:"ซื้อ @"+px(j.price),u:a/j.price});
          else if(j.sym){OPEN=j.id;inp.value="";inp.placeholder="ยังไม่มีราคา";det.open=true;return}
          else add(j,a,"ลงทุน");
          done();
        }));
        q.append(j.sym?btn("v","รีเฟรช",refresh):btn("v","อัปเดตมูลค่า",()=>{
          const a=pn(inp);
          if(!(a>=0)){need(inp);return}
          add(j,a-b,"ปรับเป็นมูลค่าตลาด",true);done();
        }));
        fld(set,"สัญลักษณ์หุ้น",j,"sym","t");
        fld(set,"ราคาต่อหน่วย",j,"price","n");
        {const l=el("label","chk"),c2=el("input");c2.type="checkbox";c2.checked=!!j.mp;
         c2.onchange=()=>{OPEN=j.id;j.mp=c2.checked;done()};
         l.append(c2,"ใช้ราคาที่กรอกเอง");set.append(l)}
      }

      if(j.type==="c"){
        const m=monthly(j),goal=j.goal||0,yrs=YR();
        line("ฝากเดือนละ",fmt(m)+" ฿");
        if(goal>0){
          const bar=el("div","bar");
          const bi=el("i");
          bi.style.width=Math.max(0,Math.min(100,b/goal*100))+"%";
          bar.append(bi);
          line("เป้าหมาย "+fmt(goal)+" ฿",(b/goal*100).toFixed(0)+"%");
          c.append(bar);
          const r=(j.rate||0)/1200,n=yrs*12,g=Math.pow(1+r,n);
          line("อีก "+yrs+" ปี ที่ "+(j.rate||0)+"%/ปี",fmt(proj(b,m,j.rate,yrs))+" ฿");
          if(n>0)line("ต้องฝากเดือนละ",fmt(Math.max(0,r?(goal-b*g)*r/(g-1):(goal-b)/n))+" ฿");
        }else line("ประมาณการอีก "+yrs+" ปี",fmt(proj(b,m,j.rate,yrs))+" ฿");
        inp.placeholder="จำนวนเงิน";
        q.append(inp,btn("m","− ถอน",go(-1)),btn("p","+ ฝาก",go(1)));
      }

      if(j.type==="f"){
        const bp=bk(j,"p"),bs=bk(j,"s");
        line("🏦 PVD (เราสมทบ)",fmt(bp)+" ฿");
        line("🏢 PVD องค์กรสมทบ ("+(j.pvdEmp||RATES.pvdEmp)+"%)",fmt(S.salary*(j.pvdEmp||RATES.pvdEmp)/100)+" ฿/เดือน");
        line("🤝 ออมทรัพย์/สหกรณ์",fmt(bs)+" ฿");
        for(const [k,ph] of [["p","ยอด PVD ปัจจุบัน"],["s","ยอดออมทรัพย์ปัจจุบัน"]]){
          const r=el("div","q one");
          const i=el("input");i.type="text";i.inputMode="decimal";i.min="0";i.placeholder=ph;
          r.append(i,btn("v","อัปเดต",()=>{
            const a=pn(i);
            if(!(a>=0)){need(i);return}
            add(j,a-bk(j,k),"ปรับเป็นยอดจริง",true,"",k);done();
          }));
          c.append(r);
        }
        q.style.display="none";
      }

      if(j.type==="o"){
        const bm={};
        for(const t of j.tx)if(t.m)bm[t.m]=(bm[t.m]||0)+t.a;
        const ks=Object.keys(bm).sort().reverse();
        if(!ks.length)line("ยังไม่มียอดยกมา","เงินเหลือสิ้นเดือนจะเข้าที่นี่");
        for(const k of ks.slice(0,6))line("เหลือจาก"+ml(k),fmt(bm[k])+" ฿");
        inp.placeholder="จำนวนเงิน";
        q.append(inp,btn("m","− ใช้",go(-1)),btn("p","+ เติม",go(1)));
      }

      if(j.type==="g"){
        const goal=j.goal||0;
        if(goal>0){
          line("เป้าหมาย "+fmt(goal)+" ฿",(b/goal*100).toFixed(0)+"%");
          const bar=el("div","bar");
          const bi=el("i");
          bi.style.width=Math.max(0,Math.min(100,b/goal*100))+"%";
          bar.append(bi);c.append(bar);
        }
        if(j.mon>0)line("ฝากต่อเดือน",fmt(j.mon)+" ฿");
        inp.placeholder="จำนวนเงิน";
        q.append(inp,btn("m","− ใช้",go(-1)),btn("p","+ เติม",go(1)));
      }

      if(j.type!=="i")c.append(q);
      if(extra)c.append(extra);
      if("fkcg".includes(j.type)){
        const al=el("label","chk"),ac=el("input");ac.type="checkbox";ac.checked=!!j.accOn;
        ac.onchange=()=>{OPEN=j.id;j.accOn=ac.checked;if(ac.checked)j.accLast=curC();done()};
        al.append(ac,"บวกผลตอบแทนเข้ายอดอัตโนมัติทุกรอบ");
        set.append(al);
      }
      det.append(el("summary",null,"ตั้งค่าและประวัติ"),set);
      const ul=el("ul");
      const hn=HN[j.id]||6;
      for(const t of j.tx.slice(-hn).reverse()){
        const li=el("li");
        li.append(
          el("span","n",short(t.d)+" "+(t.k==="p"?"PVD ":t.k==="s"?"สหกรณ์ ":"")+(t.c||"")+" "+(t.n||"")),
          el("b",t.a<0?"neg":"pos",(t.a<0?"−":"+")+fmt(Math.abs(t.a)))
        );
        const x=el("button",null,"×");x.type="button";
        x.onclick=()=>{
          OPEN=j.id;
          const ix=j.tx.indexOf(t);
          j.tx=j.tx.filter(y=>y.id!==t.id);
          UNDO={k:"del",j,t,i:ix,msg:"ลบรายการแล้ว",fresh:1};
          done();
        };
        if(!t.u){
          const eb=el("button",null,"✎");eb.type="button";
          eb.onclick=()=>{OPEN=j.id;EDIT=EDIT&&EDIT.t===t.id?null:{t:t.id};render()};
          li.append(eb);
        }
        li.append(x);
        ul.append(li);
        if(EDIT&&EDIT.t===t.id)ul.append(editForm(j,t));
      }
      if(j.type==="d"){
        const sm={};
        for(const t of cm(j))if(t.a<0&&!isSys(t)){const k=t.c||"ไม่ระบุหมวด";sm[k]=(sm[k]||0)-t.a}
        const ks=Object.keys(sm).sort((x,y)=>sm[y]-sm[x]);
        if(ks.length){
          det.append(el("div",null,"รายจ่ายเดือนนี้แยกตามหมวด"));
          const cu=el("ul");
          for(const k of ks){
            const li=el("li");
            li.append(el("span","n",k),el("b","neg",fmt(sm[k])+" ฿"));
            cu.append(li);
          }
          det.append(cu);
        }
      }
      det.append(ul);
      if(j.tx.length>hn){
        const mo=el("button","lnk","ดูเพิ่มอีก 20 รายการ");mo.type="button";
        mo.onclick=()=>{OPEN=j.id;HN[j.id]=hn+20;render()};
        det.append(mo);
      }
      c.append(det);
      (j.type==="d"?jt:"fkci".includes(j.type)?SSLOT:root).append(c);
    }catch(e){report(e)}
  }
  if(SSLOT.childNodes.length)SSLOT.prepend(el("div","sub","📦 กระปุกออม / ลงทุน (แตะเพื่อดู)"));
  safe(recentPanel);
}

function editForm(j,t){
  const li=el("li");
  li.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:6px";
  const a=el("input");a.type="text";a.inputMode="decimal";a.value=Math.abs(t.a);
  const d=el("input");d.type="date";d.value=t.d;d.max=td();
  li.append(a,d);
  let c=null;
  if(j.type==="d"&&t.a<0){
    c=el("select");
    for(const x of ["",...catsOut()]){
      const o=el("option",null,x||"ไม่ระบุหมวด");o.value=x;c.append(o);
    }
    c.value=t.c||"";
    li.append(c);
  }else if(j.type==="d"&&t.a>0){
    c=el("select");
    for(const x of ["",...catsIn()]){
      const o=el("option",null,x||"ไม่ระบุหมวด");o.value=x;c.append(o);
    }
    c.value=t.c||"";
    li.append(c);
  }
  const n=el("input");n.value=t.n||"";n.placeholder="โน้ต";li.append(n);
  li.append(
    btn("p","บันทึก",()=>{
      const v=pn(a);
      if(!(v>0)){need(a);return}
      if(!d.value||d.value>td()){d.classList.add("err");toast(FILLMSG);return}
      const was={a:t.a,d:t.d,c:t.c,n:t.n};
      t.a=(t.a<0?-1:1)*v;
      t.d=d.value;
      if(c){if(c.value)t.c=c.value;else delete t.c}
      if(n.value.trim())t.n=n.value.trim();else delete t.n;
      UNDO={k:"edit",j,t,was,msg:"แก้ไขรายการแล้ว",fresh:1};
      EDIT=null;touch(j);done();
    }),
    btn("m","ยกเลิก",()=>{EDIT=null;render()})
  );
  return li;
}

/* ============ INIT ============ */
applyTheme();

if(!S.jars.length&&!S.seeded){
  S.seeded=true;
  const t0=Date.now();
  S.jars=[
    {id:t0+1,type:"d",name:"รายรับ-รายจ่าย",end:eom(),rest:true,cb:{},tx:[]},
    {id:t0+2,type:"f",name:"PVD + สหกรณ์",emp:0,er:0,prate:RATES.pvd,mon:0,srate:RATES.coop,pvdEmp:RATES.pvdEmp,yrs:10,tx:[]},
    {id:t0+3,type:"k",name:"DCA หุ้น",mon:0,rate:RATES.dca,yrs:10,sym:"",price:0,tx:[]},
    {id:t0+4,type:"c",name:"กองทุนลูก",mon:0,goal:0,yrs:10,rate:RATES.child,tx:[]},
    {id:t0+6,type:"i",name:"ประกัน",mon:0,premium:0,cyc:"y",tx:[]}
  ];
}

if(S.auto&&S.salary>0&&S.last!==curC()){
  run();
  UNDO=null;
  store();
}

for(let i=1;i<=4;i++)$("nav"+i).onclick=()=>showTab(i);
showTab(1);
autoFund();
store();
render();
refresh();
lockUI();
</script>
