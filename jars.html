<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paopao</title>
<style>
  :root{--bg:#FFF5F8;--card:#FFF;--ink:#2D2A32;--mute:#8E8A99;--pos:#38C79C;--neg:#FF7FAF;--bad:#E5484D;--warn:#E5A400;--line:#F0E6EC;--pri:#8B78EE;--chip:#F8F5FF;--inp:#FDFAFC}
  body.dark{--bg:#12121a;--card:#1e1e2a;--ink:#e8e8f0;--mute:#8888a0;--line:#2a2a3a;--chip:#232332;--inp:#22222e;--pri:#a890f8}
  body[data-theme="blue"]{--bg:#EFF6FF;--card:#FFF;--line:#D6E6F5;--pri:#4FAEF2;--chip:#E6F2FF;--inp:#F5FAFF}
  body[data-theme="green"]{--bg:#EFFBF4;--card:#FFF;--line:#CDEBDC;--pri:#38C79C;--chip:#DEF6EA;--inp:#F5FFF9}
  body[data-theme="orange"]{--bg:#FFF6F0;--card:#FFF;--line:#F5DCCF;--pri:#FF9168;--chip:#FFEAD9;--inp:#FFF8F3}
  body[data-theme="red"]{--bg:#FFF0F5;--card:#FFF;--line:#F5D0DD;--pri:#FF7FAF;--chip:#FFE0EB;--inp:#FFF5F8}
  body[data-theme="gold"]{--bg:#FFFCEF;--card:#FFF;--line:#F0E4C0;--pri:#EFB02E;--chip:#FFF4D6;--inp:#FFFCF5}
  body.dark[data-theme="blue"]{--bg:#0c1420;--card:#1a2233;--line:#1d2a3a;--pri:#6ec0f5;--chip:#1e2936;--inp:#1a2430}
  body.dark[data-theme="green"]{--bg:#0c1a14;--card:#1a2a22;--line:#1d3a2a;--pri:#5dd4aa;--chip:#1c302a;--inp:#182820}
  body.dark[data-theme="orange"]{--bg:#1a1410;--card:#281e18;--line:#3a2a1d;--pri:#ff9d7a;--chip:#2e221c;--inp:#2a1e18}
  body.dark[data-theme="red"]{--bg:#1a1016;--card:#281a22;--line:#3a1e2c;--pri:#ff95ba;--chip:#2e1c26;--inp:#281a22}
  body.dark[data-theme="gold"]{--bg:#1a1510;--card:#281e18;--line:#3a2e1c;--pri:#f0c050;--chip:#2e2418;--inp:#281e16}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:12px 12px 90px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;transition:background .3s,color .3s}
  h1{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid var(--line);position:relative;transition:transform .2s ease,box-shadow .2s ease}
  .card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(139,120,238,.08)}
  .card.compact{padding:0}
  .card.compact .cbtn{width:100%;background:none;border:0;padding:14px 16px;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s ease}
  .card.compact .cbtn:active{background:var(--chip)}
  .cbtn .cn{flex:1;font-weight:600}
  .cbtn .cv{font-weight:700;font-variant-numeric:tabular-nums}
  .cbtn .cc{color:var(--mute);font-size:18px}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .top .name{font-weight:700;font-size:16px;flex:1}
  .top .tag{font-size:11px;background:var(--chip);color:var(--pri);padding:2px 8px;border-radius:20px}
  .top .lnk{background:none;border:0;color:var(--mute);font-size:13px;padding:4px;cursor:pointer;transition:color .15s}
  .top .lnk:hover{color:var(--pri)}
  .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 6px}
  .big.neg{color:var(--neg)}.big.pos{color:var(--pos)}
  .sub{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);margin:3px 0;gap:8px}
  .sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .sub b.neg{color:var(--neg)}.sub b.pos{color:var(--pos)}.sub b.over{color:var(--bad)}.sub b.warn{color:var(--warn)}
  .chip{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px;transition:background .3s}
  .chip b{font-size:18px;font-variant-numeric:tabular-nums}
  .chip b.neg{color:var(--neg)}.chip b.pos{color:var(--pos)}.chip b.warn{color:var(--warn)}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
  .bar.green i{background:var(--pos)}
  .bar.red i{background:var(--bad)}
  .bar.gold i{background:var(--warn)}
  input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);color:var(--ink);width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(139,120,238,.1)}
  input.err,select.err,textarea.err{border-color:var(--bad);background:#FFF5F5}
  .b{font:inherit;font-weight:600;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .12s ease,box-shadow .15s ease,background .15s ease,color .15s ease,border-color .15s ease}
  .b:hover{box-shadow:0 2px 8px rgba(139,120,238,.12)}
  .b:active{transform:scale(.96);box-shadow:0 1px 3px rgba(139,120,238,.08)}
  .b.p{background:var(--pri);color:#fff;border-color:var(--pri)}
  .b.p:hover{box-shadow:0 3px 10px rgba(139,120,238,.3)}
  .b.m{background:#FFF0F5;color:var(--neg);border-color:#FFE0EB}
  .b.v{background:var(--chip);color:var(--pri);border-color:var(--line)}
  .b.g{background:#E8FBF3;color:var(--pos);border-color:#C8F0E2}
  body.dark .b.m{background:#3a1f2a;border-color:#4a2a3a}
  body.dark .b.g{background:#1a3a2f;border-color:#255040}
  .b:disabled{opacity:.4;pointer-events:none}
  .b.star{position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s ease,color .3s ease,box-shadow .3s ease,border-color .3s ease}
  .b.star::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);transition:transform .6s ease;pointer-events:none}
  .b.star:hover::before{transform:translateX(100%)}
  .b.star.success{background:linear-gradient(135deg,#34D399,#10B981,#059669) !important;color:#fff !important;border-color:#10B981 !important;box-shadow:0 6px 20px rgba(52,211,153,.4) !important;animation:starPulse 1.2s ease}
  @keyframes starPulse{0%{transform:scale(1)}20%{transform:scale(1.06)}40%{transform:scale(.97)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  .set{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .set label{font-size:12px;color:var(--mute);margin-bottom:-4px}
  .set .row2{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
  .lnk{background:none;border:0;color:var(--pri);font-size:13px;padding:6px 0;cursor:pointer;text-align:left;transition:opacity .15s}
  .lnk:hover{opacity:.7}
  details{margin-top:10px}
  summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;color:var(--pri);list-style:none;transition:color .2s}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";display:inline-block;transition:transform .25s ease}
  details[open] summary::before{content:"▾ "}
  ul{list-style:none;padding:0;margin:8px 0}
  ul li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  ul li:last-child{border-bottom:0}
  ul li .n{flex:1;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul li b{font-variant-numeric:tabular-nums;font-weight:600}
  ul li b.neg{color:var(--neg)}ul li b.pos{color:var(--pos)}
  ul li button{background:none;border:0;color:var(--mute);font-size:15px;padding:4px 6px;cursor:pointer;border-radius:8px;transition:background .15s,color .15s}
  ul li button:active{background:var(--chip);color:var(--pri)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .chk input{width:auto}
  .grid{display:flex;flex-direction:column;gap:8px}
  .empty{text-align:center;color:var(--mute);padding:20px;font-size:14px}
  .alert{background:#FFF8E6;border:1px solid #FFE8B3;color:#8A6D00;padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px;animation:slideIn .3s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  body.dark .alert{background:#2a2410;border-color:#4a3a10;color:#f0d060}
  .alert span{flex:1}
  .alert .x{background:none;border:0;color:inherit;font-size:20px;padding:0 6px;cursor:pointer;line-height:1}
  .imp{background:#FFF5F5;border:1px solid #FFD5D5;padding:10px;border-radius:12px;font-size:13px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .st{background:var(--inp);border-radius:12px;padding:10px;border:1px solid var(--line);transition:transform .2s ease}
  .st:active{transform:scale(.98)}
  .st small{display:block;color:var(--mute);font-size:11px}
  .st b{display:block;font-size:17px;margin:2px 0;font-variant-numeric:tabular-nums}
  .st b.neg{color:var(--neg)}.st b.pos{color:var(--pos)}
  .st i{font-style:normal;font-size:11px;color:var(--mute)}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;transition:all .2s ease}
  .tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri);transform:translateY(-1px);box-shadow:0 3px 8px rgba(139,120,238,.2)}
  .icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .icons button{aspect-ratio:1;font-size:20px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;padding:0;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
  .icons button.on{border-color:var(--pri);background:var(--chip);transform:scale(1.08)}
  .icons button:active{transform:scale(.94)}
  .mt{display:grid;grid-template-columns:60px 1fr 1fr 1fr;gap:4px;font-size:12px;margin-top:8px}
  .mt span,.mt b{padding:4px}
  .mt .neg{color:var(--neg)}
  .recent{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
  .recent h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
  .recent .tabs{margin-bottom:10px}
  .recent .list{max-height:320px;overflow-y:auto}
  .recent .list .grp{font-size:11px;color:var(--mute);margin:10px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .recent .list .item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .recent .list .item:last-child{border-bottom:0}
  .recent .list .item .n{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recent .list .item .amt{font-weight:700;font-variant-numeric:tabular-nums}
  .recent .list .item .amt.neg{color:var(--neg)}.recent .list .item .amt.pos{color:var(--pos)}
  .recent .list .item .undo{background:#FFF0F5;border:1px solid #FFE0EB;color:var(--neg);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;transition:transform .12s ease}
  .recent .list .item .undo:active{transform:scale(.94)}
  dialog{border:0;border-radius:16px;padding:20px;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2);background:var(--card);color:var(--ink);animation:dlgIn .28s cubic-bezier(.34,1.56,.64,1)}
  @keyframes dlgIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  dialog h3{margin:0 0 10px;font-size:16px}
  dialog p{margin:6px 0;font-size:14px;color:var(--mute)}
  dialog .btns{display:flex;gap:8px;margin-top:16px}
  dialog .btns button{flex:1}
  #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(45,42,50,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:1000;display:none;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);font-weight:500;animation:toastIn .3s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes toastIn{to{transform:translateX(-50%) translateY(0)}}
  #undo{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(45,42,50,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:1000;display:none;max-width:90%;align-items:center;gap:12px}
  #undo button{background:var(--pri);border:0;color:#fff;padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s ease}
  #undo button:active{transform:scale(.95)}
  #lock{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  .lt{font-size:18px;font-weight:700}
  .ld{font-size:28px;letter-spacing:8px}
  .lm{color:var(--bad);font-size:14px;min-height:20px}
  .lp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;width:100%}
  .lp button{aspect-ratio:1;font-size:20px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-weight:600;transition:all .15s ease}
  .lp button:active{transform:scale(.94);background:var(--chip)}
  #jtop{margin-bottom:0}
  #sslot{display:flex;flex-direction:column;gap:12px}
  #sslot>.sub{text-align:center;font-size:12px;color:var(--mute);margin:4px 0}
  .t-d .big{color:var(--ink)}.t-f .big{color:#4FAEF2}.t-k .big{color:var(--neg)}.t-c .big{color:#38C79C}.t-i .big{color:#EFB02E}.t-g .big{color:var(--pri)}.t-o .big{color:#7ACB5B}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;padding:10px 4px 12px;font:inherit;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:color .2s ease}
  nav button.on{color:var(--pri);font-weight:700}
  nav button span{font-size:20px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  nav button.on span{transform:scale(1.15) translateY(-1px)}
  #nic{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
  #nic button{aspect-ratio:1;font-size:20px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;padding:0;transition:all .2s}
  #nic button.on{border-color:var(--pri);background:var(--chip);transform:scale(1.08)}
  .pcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--inp);display:flex;flex-direction:column;gap:8px;position:relative}
  .prow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
  .pdel{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px;line-height:1;border-radius:8px;transition:all .15s}
  .pdel:active{transform:scale(.9);background:var(--chip)}
  .monthsel{background:var(--chip);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .monthsel label{font-size:15px;color:var(--mute);white-space:nowrap}
  .monthsel select{margin:0;flex:1}
  .pvd-sum{background:var(--chip);border-radius:10px;padding:10px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
  .pvd-sum span{font-size:13px;color:var(--mute)}
  .pvd-sum b{font-size:18px;font-variant-numeric:tabular-nums;color:var(--pri)}
  .inout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;padding:10px;background:var(--chip);border-radius:12px}
  .inout .row{display:flex;flex-direction:column;gap:6px}
  .inout .row .lbl{font-size:12px;color:var(--mute);font-weight:600}
  .inout .row button{padding:8px 10px;font-size:13px;border-radius:10px}
</style>
</head>
<body>
<h1>🐷 กระปุกของฉัน</h1>
<div id="alerts"></div>

<section id="tab1">
  <div id="jtop"></div>
  <div id="jars"></div>
  <div id="recent"></div>
  <div id="sslot"></div>
</section>

<section id="tab2" hidden>
  <div id="sal"></div>
</section>

<section id="tab3" hidden>
  <div id="sum"></div>
</section>

<section id="tab4" hidden>
  <div id="cfg"></div>
</section>

<nav>
  <button id="nav1" class="on"><span>🏠</span>กระปุก</button>
  <button id="nav2"><span>⚙️</span>เป๋าหลัก</button>
  <button id="nav3"><span>📊</span>สรุป</button>
  <button id="nav4"><span>🛠️</span>ตั้งค่า</button>
</nav>

<script>const KEY="jars-v2";
const EM={d:"🐷",f:"🏦",k:"📈",c:"🧸",o:"🍀",i:"🛡️",g:"💰",emg:"⚠️",debt:"💳"};
const TY={d:"รายรับ-รายจ่าย",f:"PVD + สหกรณ์",k:"DCA หุ้น",c:"กองทุนลูก",o:"เงินเหลือ",i:"ประกัน",g:"กระปุกทั่วไป",emg:"งบฉุกเฉิน",debt:"หนี้"};
const RATES={pvd:5,pvdEmp:9,coop:5,dca:7,child:3};
const CATS_IN=["เงินเดือน","โบนัส","ขายของ","ดอกเบี้ย","อื่นๆ"];
const CATS_OUT=["ค่าอาหาร","ค่าน้ำ","ค่าช้อปปิ้ง","ค่าเดินทาง","ค่ารายเดือนให้ที่บ้าน","ค่ารายเดือนทั่วไป","ค่าโทรศัพท์","อื่นๆ"];
const MONTHS_TH=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const MONTHS_SHORT=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

let S={salary:0,auto:false,last:"",jars:[],theme:"light",color:"purple",mon:{}};
let OPEN=0,CBO=0,MB=0,LMON=null;
let LOADERR=false,LASTSAVED="",RAWLOAD="";

try{
  const r=window.Android?Android.load():localStorage.getItem(KEY);
  if(r){
    LASTSAVED=r;RAWLOAD=r;
    try{S=Object.assign(S,JSON.parse(r))}
    catch(e){
      LOADERR=true;
      try{localStorage.setItem(KEY+"-bak",r)}catch(_){}
    }
  }
}catch(e){LOADERR=true}

function migrate(){
  if(!Array.isArray(S.jars))return;
  const ps=S.jars.filter(j=>j&&j.type==="p");
  const ss=S.jars.filter(j=>j&&j.type==="s");
  if(!ps.length&&!ss.length)return;
  try{localStorage.setItem(KEY+"-bak",RAWLOAD||JSON.stringify(S))}catch(e){}
  try{
    const txs=j=>Array.isArray(j.tx)?j.tx:[];
    const tag=(j,k)=>txs(j).map(t=>Object.assign({},t,{k}));
    let f=S.jars.find(j=>j&&j.type==="f");
    const had=!!f,base=ps[0]||ss[0];
    if(!f)f={id:base.id,type:"f",name:"PVD + สหกรณ์",emp:0,er:0,prate:RATES.pvd,mon:0,srate:RATES.coop,pvdEmp:RATES.pvdEmp,yrs:10,tx:[]};
    if(!Array.isArray(f.tx))f.tx=[];
    for(const j of ps){
      if(!f.emp)f.emp=j.emp||0;
      if(!f.er)f.er=j.er||0;
      if(!f.prate)f.prate=j.rate||RATES.pvd;
      f.yrs=j.yrs||f.yrs;
      f.tx.push(...tag(j,"p"));

function stats0(ym){
  const sum=o=>Object.values(o).reduce((x,y)=>x+y,0);
  if(ym.length===4){
    const X=idx();
    const ks=[...new Set([...Object.keys(S.mon||{}),...Object.keys(X)])].filter(k=>k.startsWith(ym));
    const o={inc:0,reg:0,add2:0,ex:{},sv:{},buy:0,prem:0,over:{}};
    for(const k of ks){
      const m=stats(k);
      o.inc+=m.inc;o.reg+=m.reg;o.add2+=m.add2;o.buy+=m.buy;o.prem+=m.prem;
      for(const n in m.ex)o.ex[n]=(o.ex[n]||0)+m.ex[n];
      for(const n in m.sv)o.sv[n]=(o.sv[n]||0)+m.sv[n];
      for(const n in m.over)o.over[n]=(o.over[n]||0)+m.over[n];
    }
    o.spend=sum(o.ex);o.save=sum(o.sv);o.left=o.inc-o.spend-o.save;
    return o;
  }
  const mon=(S.mon||{})[ym]||{};
  const ex={};
  const snap=mon.sav?Object.assign({},mon.sav):null;
  const sv=snap||{};
  let add2=0,buy=0,prem=0;
  for(const [j,t] of (idx()[ym]||[])){
    const tp=j.type;
    if(tp==="d"||tp==="o"||tp==="emg"){
      if(isSys(t)||t.m)continue;
      if(t.a<0){
        const k=t.c||(tp==="o"?"จากเงินเหลือ":"ไม่ระบุหมวด");
        ex[k]=(ex[k]||0)-t.a;
      }else add2+=t.a;
    }else if(tp==="i"&&t.a<0)prem+=-t.a;
    else if(t.a>0&&"fkcipsg".includes(tp)){
      if(!AUTON.includes(t.n))buy+=t.a;
      else if(!snap){
        let a=t.a;
        if(tp==="f"&&t.n==="สมทบ PVD"&&(j.emp||0)+(j.er||0)>0)a=a*(j.emp||0)/((j.emp||0)+(j.er||0));
        sv[j.name]=(sv[j.name]||0)+a;
      }
    }
  }
  if(mon.ded>0)ex["หักอื่นๆ (ภาษี ฯลฯ)"]=mon.ded;
  const inc=(mon.inc||0)+add2;
  const over={};
  const dj=S.jars.find(j=>j.type==="d");
  if(dj&&dj.cb){
    for(const k in dj.cb){
      const b=dj.cb[k];
      if(!(b>0))continue;
      const sp=ex[k]||0;
      if(sp>b)over[k]=sp-b;
    }
  }
  return {inc,reg:mon.inc||0,add2,ex,sv,buy,prem,over,spend:sum(ex),save:sum(sv),left:inc-sum(ex)-sum(sv)};
}

  const ij=S.jars.find(j=>j.type==="i");

    if(ins>0)ij.tx.push({id:Date.now()+Math.random()+5,a:ins,d:t0,n:"แบ่งเงินเดือน",split:ym});
  }

  const total=S.salary+(S.extra||0)-(S.deduct||0)-calcSplitTotal();
  if(total>0){
    dj.tx=dj.tx.filter(t=>cyc(t.d)!==ym||t.n!=="ส่วนที่เหลือจากเงินเดือน");

  saveMonthSplit(ym);

  return S.jars.reduce((x,j)=>x+j.tx.length,0)-n0;
}

function postRec(j){
  const cur=curC();
  for(const r of j.rec||[]){
    if(!r.last)r.last=cur;
    let g=0;
    while(r.last<cur&&g++<120){
      r.last=shiftM(r.last,1);
      const d=cs(r.last);
      const t={id:Date.now()+Math.random(),a:-Math.abs(r.a),d:d>td()?td():d,n:"ประจำ: "+r.n};
      if(r.c)t.c=r.c;
      j.tx.push(t);
    }
  }
}
function postAcc(j){
  if(!j.accOn)return;
  const cur=curC();
  if(!j.accLast){j.accLast=cur;return}
  let g=0;
  while(j.accLast<cur&&g++<120){
    j.accLast=shiftM(j.accLast,1);
    const d=cs(j.accLast),dt=d>td()?td():d;
    const ks=j.type==="f"?[["p",j.prate],["s",j.srate]]:[["",j.rate]];
    for(const [k,r] of ks){
      if(!(r>0)||(j.type==="k"&&j.price>0&&units(j)>0))continue;
      const a=Math.round((k?bk(j,k):agg(j).sum)*r/1200*100)/100;
      if(a>0){const t={id:Date.now()+Math.random(),a,d:dt,n:"ผลตอบแทน",adj:1};if(k)t.k=k;j.tx.push(t)}
    }
  }
}
function autoFund(){
  const t0=td();
  for(const j of S.jars){
    if(j.type==="d"&&(!j.endCustom||!j.end||j.end<t0)){j.end=cend();j.endCustom=false}
  }
  for(const j of S.jars){
    if(j.type==="d")postRec(j);
    postAcc(j);
  }
  const ym=curC();
  if(S.salary>0){
    const sv={};
    for(const x of S.jars){
      if(x.rest||x.type==="d"||x.type==="o"||x.type==="emg"||x.type==="debt")continue;
      const a=empPart(x);
      if(a>0)sv[x.name]=a;
    }
    (S.mon=S.mon||{})[ym]={inc:S.salary+(S.extra||0),ded:S.deduct||0,sav:sv};
  }
  for(const j of S.jars){
    if(j.type!=="d"||!j.rest)continue;
    if(j.funded!==ym){j.end=eom();j.funded=ym}
    const m=monthly(j);
    const fl=cm(j).filter(t=>t.n==="ส่วนที่เหลือจากเงินเดือน"||t.n==="ปรับส่วนที่เหลือ"||t.n==="แบ่งเงินเดือน");
    const cur=fl.reduce((x,t)=>x+t.a,0);
    if(fl.length===(m>0?1:0)&&Math.abs(cur-m)<=0.5)continue;
    j.tx=j.tx.filter(t=>!fl.includes(t));
    if(m>0){
      const d=cs(ym);
      j.tx.push({id:Date.now()+Math.random(),a:m,d:d>td()?td():d,n:"ส่วนที่เหลือจากเงินเดือน"});
    }
    V++;
  }
}
function pie(items,total,center){
  const NS="http://www.w3.org/2000/svg";
  const mk=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e};
  const svg=mk("svg",{viewBox:"-1.05 -1.05 2.1 2.1",width:"200",height:"200"});
  svg.style.cssText="display:block;margin:8px auto";
  let a0=-Math.PI/2;
  items.forEach((it,i)=>{
    const f=it.v/total;let e;
    if(f>=0.9999)e=mk("circle",{r:1});
    else{
      const a1=a0+f*2*Math.PI;
      e=mk("path",{d:`M ${Math.cos(a0)} ${Math.sin(a0)} A 1 1 0 ${f>.5?1:0} 1 ${Math.cos(a1)} ${Math.sin(a1)} L 0 0 Z`});
      a0=a1;
    }
    e.style.fill=it.col||COL[i%COL.length];
    e.style.stroke="var(--card)";
    e.style.strokeWidth="0.025";
    svg.append(e);
  });
  const h=mk("circle",{r:.56});h.style.fill="var(--card)";svg.append(h);
  const t1=mk("text",{x:0,y:-.05,"text-anchor":"middle","font-size":".13"});
  t1.textContent=center[0];t1.style.fill="var(--mute)";
  const t2=mk("text",{x:0,y:.17,"text-anchor":"middle","font-size":".2","font-weight":"700"});
  t2.textContent=center[1];t2.style.fill="var(--ink)";
  svg.append(t1,t2);
  return svg;
}

function alertsList(){
  const L=[],t0=td(),N=S.notif||{};
  const dj=S.jars.find(j=>j.type==="d");
  if(dj && N.daily && N.daily.on===true){
    const net=cm(dj).filter(t=>t.d===t0&&!isSys(t)).reduce((s,t)=>s+t.a,0);
    const spent=-cm(dj).filter(t=>t.d===t0&&t.a<0&&!isSys(t)).reduce((s,t)=>s+t.a,0);
    const dl=Math.max(1,dd(t0,dj.end||eom())+1);
    const b=bal(dj);
    const lim=b/dl+net;
    if(lim>0){
      const pct=spent/lim*100;
      const th=N.daily.pct||100;
      if(pct>=th)L.push({id:"daily:"+t0,text:"💸 วันนี้ใช้ไป "+Math.round(pct)+"% ของงบวัน ("+fmt(spent)+" / "+fmt(lim)+" ฿)"});
    }
  }
  if(N.cats && N.cats.on===true){
    const sel=N.cats.list||[];
    const th=N.cats.pct||90;
    for(const j of S.jars){
      if(j.type!=="d"||!j.cb)continue;
      for(const k of Object.keys(j.cb)){
        const b=j.cb[k];
        if(!(b>0))continue;
        if(!sel.includes(k))continue;
        const sp=-cm(j).filter(t=>t.a<0&&t.c===k).reduce((x,t)=>x+t.a,0);
        const pct=sp/b*100;
        if(N.cats.over===true && sp>b){
          L.push({id:"cat-over:"+k,text:"⚠️ "+k+" เกินงบ "+fmt(sp-b)+" ฿ (ใช้ "+fmt(sp)+" / "+fmt(b)+" ฿)"});
        }else if(pct>=th){
          L.push({id:"cat-near:"+k,text:"⚡ "+k+" ใช้ไป "+Math.round(pct)+"% ของงบ ("+fmt(sp)+" / "+fmt(b)+" ฿)"});
        }
      }
    }
  }
  if(N.emg && N.emg.on!==false){
    for(const j of S.jars){
      if(j.type!=="emg")continue;
      const min=j.min||0;
      if(min>0&&bal(j)<min)L.push({id:"emg:"+j.id,text:"⚠️ งบฉุกเฉินต่ำกว่าเป้า "+(min-bal(j))+" ฿"});
    }
  }
  const dis=S.dismissed||{};
  return L.filter(x=>dis[x.id]!==t0);
}

  dlg.append(el("p",null,cnt>0?"มี "+cnt+" รายการใช้หมวดนี้อยู่":"ยังไม่มีรายการใช้หมวดนี้"));
  const btns=el("div","btns");

    if(kind==="in")S.catsIn=catsIn().filter(x=>x!==name);

    CFO=true;dlg.close();done();
  }));
  dlg.append(btns);
  document.body.append(dlg);
  dlg.showModal();
  dlg.addEventListener("close",()=>dlg.remove());

function renameCatOut(a,b){
  S.cats=catsOut().map(x=>x===a?b:x);
  for(const j of S.jars){
    for(const t of j.tx)if(t.c===a)t.c=b;
    if(j.cb&&a in j.cb){j.cb[b]=j.cb[a];delete j.cb[a]}
    for(const r of j.rec||[])if(r.c===a)r.c=b;
  }
  CFO=true;
  S.jars.forEach(touch);
  done();
}

function renameCatIn(a,b){
  S.catsIn=catsIn().map(x=>x===a?b:x);
  for(const j of S.jars){
    for(const t of j.tx)if(t.c===a)t.c=b;
    for(const r of j.rec||[])if(r.c===a)r.c=b;
  }
  CFO=true;
  S.jars.forEach(touch);
  done();
}

const h53=(str,seed=0)=>{
  let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){
    ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return String(4294967296*(2097151&h2)+(h1>>>0));
};
const pinH=p=>h53("jars|"+p);

function run(){
  if(!(S.salary>0))return -1;
  const ym=curC(),n0=S.jars.reduce((x,j)=>x+j.tx.length,0);
  for(const j of S.jars){
    if(j.type==="emg"||j.type==="debt")continue;
    if(j.rest){j.end=eom();continue}
    if(cm(j).some(t=>AUTON.includes(t.n)&&t.n!=="ผลตอบแทน"))continue;
    if(j.type==="f"){
      const pv=S.salary*((j.emp||0)+(j.er||0))/100;
      if(pv>0)add(j,pv,"สมทบ PVD",false,"","p");
      if(j.mon>0)add(j,j.mon,"ส่งหุ้นสหกรณ์",false,"","s");
      continue;
    }
    const a=monthly(j);
    if(a>0)add(j,a,"แบ่งเงินเดือน");
  }
  S.last=curC();
  return S.jars.reduce((x,j)=>x+j.tx.length,0)-n0;
}

function render(){
  safe(applyTheme);
  safe(salary);
  safe(sumPanel);
  safe(alertsPanel);
  safe(cfgPanel);
  safe(syncAlerts);
  safe(syncQuick);
  safe(syncWidget);

  const root=$("jars");root.innerHTML="";
const jt=$("jtop");jt.innerHTML="";
const sslot=$("sslot");if(sslot)sslot.innerHTML="";
  if(!S.jars.length){
    root.append(el("p","empty","🐷 ยังไม่มีกระปุก"));
  }

  for(const j of S.jars){
    try{
      if(j.type==="f"||j.type==="k"||j.type==="c"||j.type==="i")continue;
      const b=bal(j);
      const c=el("section","card t-"+j.type);
      const top=el("div","top");

      top.append(
        el("span","name",(j.ic||EM[j.type]||"💰")+" "+j.name),
        (()=>{const t=el("span","tag",TY[j.type]||"");if(j.name===TY[j.type])t.style.display="none";return t})()
      );
      c.append(top,el("div","big "+(b<0?"neg":"pos"),fmt(b)+" ฿"));

      const line=(l,v,cls)=>{const s=el("div","sub");s.append(el("span",null,l),el("b",cls||null,v));c.append(s)};
      const det=el("details");if(OPEN===j.id)det.open=true;
      const set=el("div","set");
      const inp=el("input");inp.type="text";inp.inputMode="decimal";inp.min="0";
      const q=el("div","q");

      if(j.type==="d"){
        const net=cm(j).filter(t=>t.d===td()&&!isSys(t)).reduce((s,t)=>s+t.a,0);
        const spent=-cm(j).filter(t=>t.d===td()&&t.a<0&&!isSys(t)).reduce((s,t)=>s+t.a,0);
        const dl=Math.max(1,dd(td(),j.end||eom())+1);
        const lim=(b-net)/dl,tl=lim+net;
        const chipCls=tl<0?"neg":(lim>0&&spent>lim*0.8?"warn":"pos");
        const chip=el("div","chip");
        chip.append(el("span",null,"วันนี้ใช้ได้อีก"),el("b",chipCls,fmt(tl)+" ฿"));
        c.append(chip);
        line("ใช้ได้วันละ (คงเหลือ ÷ "+dl+" วัน)",fmt(b/dl)+" ฿");
        const spentCls=lim>0&&spent>lim?"over":(lim>0&&spent>lim*0.8?"warn":"");
        line("วันนี้ใช้ไป "+fmt(spent)+" · เหลือ",fmt(tl)+" ฿",spentCls);
        line("งบรอบนี้ (อัตโนมัติ)",fmt(monthly(j))+" ฿");
        const bar=el("div","bar");
        const bi=el("i");
        bi.style.width=(lim>0?Math.max(0,Math.min(100,tl/lim*100)):0)+"%";
        if(tl<0)bi.style.background="var(--bad)";
        bar.append(bi);c.append(bar);

        const io=el("div","inout");
        const r1=el("div","row");
        r1.append(el("span","lbl","💵 รายรับ"));
        r1.append(btn("g","+ เพิ่มรายรับ",()=>{
          askAmt("รับเข้า",false,(amt,cat)=>{
            add(j,amt,"",false,cat);
            done();
          });
        }));
        const r2=el("div","row");
        r2.append(el("span","lbl","💸 รายจ่าย"));
        r2.append(btn("m","− เพิ่มรายจ่าย",()=>{
          askAmt("ใช้จ่าย",true,(amt,cat)=>{
            add(j,-amt,"",false,cat);
            done();
          });
        }));
        io.append(r1,r2);
        c.append(io);

        j.cb=j.cb||{};
        const cd=el("details");cd.open=CBO===j.id;
        cd.append(el("summary",null,"งบแยกตามหมวดต่อเดือน"));
        const cg=el("div","set");
        cg.addEventListener("focusin",()=>{OPEN=j.id;CBO=j.id});
        for(const k of catsOut())fld(cg,k,j.cb,k,"n");
        cd.append(cg);
        set.append(cd);

        const rd=el("details");rd.open=RCO===j.id;
        rd.append(el("summary",null,"🔁 รายการประจำ"));
        const rg=el("div","set");
        rg.addEventListener("focusin",()=>{OPEN=j.id;RCO=j.id});
        const rl=el("ul");
        for(const r of j.rec||[]){
          const li=el("li");
          li.append(el("span","n",r.n+(r.c?" · "+r.c:"")),el("b","neg",fmt(r.a)+" ฿"));
          const rx=el("button",null,"×");rx.type="button";
          rx.onclick=()=>{OPEN=j.id;RCO=j.id;j.rec=j.rec.filter(y=>y!==r);done()};
          li.append(rx);rl.append(li);
        }
        const rn=el("input");rn.placeholder="ชื่อรายการ";
        const ra=el("input");ra.type="text";ra.inputMode="decimal";ra.placeholder="จำนวนเงินต่อรอบ";
        const rc=el("select");
        for(const x of ["",...catsOut()]){const o=el("option",null,x||"หมวด (ไม่ระบุ)");o.value=x;rc.append(o)}
        rg.append(rl,rn,ra,rc,btn("p","เพิ่มรายการประจำ",()=>{
          const a=pn(ra),n=rn.value.trim();
          if(!n){rn.classList.add("err");toast(FILLMSG);return}
          if(!(a>0)){need(ra);return}
          (j.rec=j.rec||[]).push({id:Date.now(),n,a,c:rc.value,last:curC()});
          OPEN=j.id;RCO=j.id;done();
        }));
        rd.append(rg);
        set.append(rd);
      }

      if(j.type==="g"){
        if(j.mon>0)line("ฝากต่อเดือน",fmt(j.mon)+" ฿");
        inp.placeholder="จำนวนเงิน";
        q.append(inp,btn("m","− ใช้",go(-1)),btn("p","+ เติม",go(1)));
      }

      if(j.type==="d")c.append(q);
      if(j.type==="g")c.append(q);

      det.append(el("summary",null,"ตั้งค่าและประวัติ"),set);
      const ul=el("ul");
      const hn=HN[j.id]||6;
      for(const t of j.tx.slice(-hn).reverse()){
        const li=el("li");
        li.append(
          el("span","n",short(t.d)+" "+(t.c||"")+" "+(t.n||"")),
          el("b",t.a<0?"neg":"pos",(t.a<0?"−":"+")+fmt(Math.abs(t.a)))
        );
        const x=el("button",null,"×");x.type="button";
        x.onclick=()=>{
          OPEN=j.id;
          const ix=j.tx.indexOf(t);
          j.tx=j.tx.filter(y=>y.id!==t.id);
          UNDO={k:"del",j,t,i:ix,msg:"ลบรายการแล้ว",fresh:1};
          done();
        };
        li.append(x);ul.append(li);
      }
      det.append(ul);
      if(j.tx.length>hn){
        const mo=el("button","lnk","ดูเพิ่มอีก 20 รายการ");mo.type="button";
        mo.onclick=()=>{OPEN=j.id;HN[j.id]=hn+20;render()};
        det.append(mo);
      }
      c.append(det);
      root.append(c);
    }catch(e){report(e)}
  }

  safe(recentPanel);
}

function editForm(j,t){
  const li=el("li");
  li.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:6px";
  const a=el("input");a.type="text";a.inputMode="decimal";a.value=Math.abs(t.a);
  const d=el("input");d.type="date";d.value=t.d;d.max=td();
  li.append(a,d);
  let c=null;
  if(j.type==="d"&&t.a<0){
    c=el("select");
    for(const x of ["",...catsOut()]){
      const o=el("option",null,x||"ไม่ระบุหมวด");o.value=x;c.append(o);
    }
    c.value=t.c||"";
    li.append(c);
  }else if(j.type==="d"&&t.a>0){
    c=el("select");
    for(const x of ["",...catsIn()]){
      const o=el("option",null,x||"ไม่ระบุหมวด");o.value=x;c.append(o);
    }
    c.value=t.c||"";
    li.append(c);
  }
  const n=el("input");n.value=t.n||"";n.placeholder="โน้ต";li.append(n);
  li.append(
    btn("p","บันทึก",()=>{
      const v=pn(a);
      if(!(v>0)){need(a);return}
      if(!d.value||d.value>td()){d.classList.add("err");toast(FILLMSG);return}
      const was={a:t.a,d:t.d,c:t.c,n:t.n};
      t.a=(t.a<0?-1:1)*v;
      t.d=d.value;
      if(c){if(c.value)t.c=c.value;else delete t.c}
      if(n.value.trim())t.n=n.value.trim();else delete t.n;
      UNDO={k:"edit",j,t,was,msg:"แก้ไขรายการแล้ว",fresh:1};
      EDIT=null;touch(j);done();
    }),
    btn("m","ยกเลิก",()=>{EDIT=null;render()})
  );
  return li;
}

/* ============ WIDGET BRIDGE ============ */
const W_CATS=["ค่าอาหาร","ค่าช้อปปิ้ง","ค่าเดินทาง"];
function wCfg(){
  if(!S.widget)S.widget={};
  const w=S.widget;
  if(!w.cats)w.cats=W_CATS.slice();
  if(typeof w.limit!=="number")w.limit=0;
  return w;
}
function wSpent(){
  const dj=S.jars.find(j=>j.type==="d");
  if(!dj)return 0;
  const ym=curC();
  const cats=wCfg().cats;
  return -dj.tx.filter(t=>cyc(t.d)===ym&&t.a<0&&!isSys(t)&&cats.includes(t.c)).reduce((x,t)=>x+t.a,0);
}
function wLimit(){return wCfg().limit||0}
function widgetData(){
  const w=wCfg();
  const spent=wSpent();
  const lim=wLimit();
  const over=lim>0&&spent>lim;
  const cats=w.cats.map(c=>{
    const dj=S.jars.find(j=>j.type==="d");
    const ym=curC();
    const sp=dj?-dj.tx.filter(t=>cyc(t.d)===ym&&t.a<0&&!isSys(t)&&t.c===c).reduce((x,t)=>x+t.a,0):0;
    return{name:c,spent:Math.round(sp*100)/100};
  });
  return{
    spent:Math.round(spent*100)/100,
    limit:lim,over:over,cats:cats,
    pct:lim>0?Math.min(100,spent/lim*100):0
  };
}
function syncWidget(){
  if(!window.Android||!Android.setWidget)return;
  try{Android.setWidget(JSON.stringify(widgetData()))}catch(e){console.error(e)}
}
window.__widgetAdd=(cat,amt,type)=>{
  const dj=S.jars.find(j=>j.type==="d");
  if(!dj)return false;
  const sign=type==="minus"?-1:1;
  add(dj,sign*Math.abs(amt),"จากวิดเจ็ต",false,cat);
  done();
  return true;
};
